<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obediente AI - Solicitud</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="container nav">
            <h1 class="logo">Obediente AI</h1>
            <nav>
                <a href="index.html">Inicio</a>

                <a href="login.html">Login</a>

    <div class="container">
        <section>
            <h2 style="text-align: center; margin-bottom: 20px;">Solicitud de servicio</h2>

            <form>
                <input type="text" placeholder="Nombre completo">
                <input type="email" placeholder="Correo electrónico">
                <input type="text" placeholder="Número de teléfono">

                <select>
                    <option>Selecciona un servicio</option>
                    <option>Recordatorio de pagos</option>
                    <option>Automatización para negocios</option>
                </select>

                <textarea rows="5" placeholder="Describe brevemente tu proyecto"></textarea>

                <button type="submit">Enviar solicitud</button>
            </form>
        </section>
    </div>

    <footer>
        <p>© 2026 Obediente AI</p>
    </footer>
