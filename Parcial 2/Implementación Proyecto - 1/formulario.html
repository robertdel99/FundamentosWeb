<!DOCTYPE html>

<div class="container">
    <section>
        <h2 style="text-align: center; margin-bottom: 20px;">Solicita información</h2>

        <form>
            <input type="text" placeholder="Tu nombre">
            <input type="email" placeholder="tucorreo@mail.com">
            <input type="text" placeholder="Tu número telefónico">

            <select>
                <option>Selecciona un servicio</option>
                <option>Recordatorio de pagos</option>
                <option>Automatización de negocios</option>
            </select>

            <textarea rows="5" placeholder="Describe brevemente tu proyecto"></textarea>

            <button type="submit">Enviar solicitud</button>
        </form>
    </section>
</div>
