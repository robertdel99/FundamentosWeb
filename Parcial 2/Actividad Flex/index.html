<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio contenedor Flex</title>

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .encabezado {
            background-color: #d98c2b;
            text-align: center;
            padding: 25px;
        }

        .encabezado h1 {
            font-size: 24px;
            font-weight: bold;
            height: 24px;
            line-height: 24px;
        }

        .contenedor-flex {
            display: flex;
            min-height: calc(100vh - 74px);
        }

        .izquierda,
        .centro,
        .derecha {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 18px;
            padding: 20px;
        }

        .izquierda {
            flex: 1;
            background-color: #4a4a4a;
            color: white;
        }

        .centro {
            flex: 2;
            background-color: #f5f5f5;
            color: #222;
        }

        .derecha {
            flex: 1;
            background-color: #4a4a4a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="encabezado">
        <h1>Diseño Flex Box</h1>
    </div>

    <div class="contenedor-flex">
        <div class="izquierda">Lateral izquierdo</div>
        <div class="centro">Zona central</div>
        <div class="derecha">Lateral derecho</div>
    </div>

</body>
</html>
