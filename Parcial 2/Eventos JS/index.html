<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica RGB - Eventos JS</title>

    <style>
        .zona {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bloque {
            width: 190px;
            height: 190px;
            text-align: center;
            font-weight: bold;
            border: 1px solid gray;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <button onclick="agregarBloque()">Crear bloque</button>
    <input type="text" id="nombreElemento">

    <br><br>

    <label>R</label>
    <input type="number" id="valorRojo" min="0" max="255">

    <label>G</label>
    <input type="number" id="valorVerde" min="0" max="255">

    <label>B</label>
    <input type="number" id="valorAzul" min="0" max="255">

    <br><br>

    <div class="zona"></div>

    <script>
        const zona = document.querySelector(".zona");
        const nombreElemento = document.getElementById("nombreElemento");
        const valorRojo = document.getElementById("valorRojo");
        const valorVerde = document.getElementById("valorVerde");
        const valorAzul = document.getElementById("valorAzul");

        function agregarBloque() {
            const bloque = document.createElement("div");
            bloque.classList.add("bloque");

            bloque.textContent = nombreElemento.value;

            let rojo = valorRojo.value;
            let verde = valorVerde.value;
            let azul = valorAzul.value;

            if (rojo == "") {
                rojo = 0;
            }

            if (verde == "") {
                verde = 0;
            }

            if (azul == "") {
                azul = 0;
            }

            bloque.style.backgroundColor = "rgb(" + rojo + "," + verde + "," + azul + ")";
            zona.appendChild(bloque);

            nombreElemento.value = "";
        }
    </script>

</body>
</html>
